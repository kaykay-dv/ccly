[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccly"
version = "0.1.0"
description = "Cicely: a portable Django project for apps you publish yourself."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Karl" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "Django>=5.2,<6.2",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "django-axes>=8",
    "django-ratelimit>=4.1,<5",
    "python-dotenv>=1.0",
    "dj-database-url>=2.1",
    "sphinx>=7",
    "sphinx-rtd-theme>=3",
]

[project.urls]
Author = "https://github.com/kaykay-dv/"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hatchling",
]

[project.scripts]
ccly = "ccly.cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/ccly"]

[tool.hatch.build.targets.wheel.sources]
"src/ccly" = "ccly"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
