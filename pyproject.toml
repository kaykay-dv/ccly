[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccly"
version = "0.1.0"
description = "Cicely: a portable Django project for apps you publish yourself."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "Django>=5.2,<6.2",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "django-axes>=8",
    "python-dotenv>=1.0",
    "dj-database-url>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hatchling",
]

[project.scripts]
ccly = "ccly.cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/ccly"]

[tool.hatch.build.targets.wheel.sources]
"src/ccly" = "ccly"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
